<!doctype html>
<html lang="en" class="h-full">
 <head><script src="/_sdk/telemetry_sdk.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Outfit', sans-serif; }
    .glass { background: rgba(255,255,255,0.12); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); }
    .dark .glass { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); }
    .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity:0; } to { transform: translateY(0); opacity:1; } }
    @keyframes fadeOut { to { opacity:0; } }
    .result-card { animation: popIn 0.3s ease; }
    @keyframes popIn { from { transform: scale(0.95); opacity:0; } to { transform: scale(1); opacity:1; } }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full overflow-auto">
  <div id="app" class="min-h-full w-full bg-gradient-to-br from-orange-400 via-pink-500 to-purple-600 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 p-4 md:p-8 transition-colors duration-500">
   <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>
   <div class="max-w-lg mx-auto"><!-- Header -->
    <div class="flex justify-between items-center mb-6">
     <h1 id="title" class="text-2xl md:text-3xl font-bold text-white">Temperature Converter</h1><button id="theme-toggle" class="glass rounded-full p-2 text-white hover:scale-110 transition-transform"> <i data-lucide="sun" class="w-5 h-5 dark:hidden"></i> <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i> </button>
    </div><!-- DateTime -->
    <p id="datetime" class="text-white/70 text-sm mb-4"></p><!-- Main Card -->
    <div class="glass rounded-2xl p-6 md:p-8 mb-6">
     <div class="space-y-4">
      <div><label for="temp-input" class="text-white/80 text-sm font-medium mb-1 block">Temperature</label> <input id="temp-input" type="text" placeholder="Enter temperature..." class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-white/40 transition">
      </div>
      <div class="grid grid-cols-2 gap-3">
       <div><label for="from-unit" class="text-white/80 text-sm font-medium mb-1 block">From</label> <select id="from-unit" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-white/40 transition appearance-none"> <option value="C" class="text-gray-900">Celsius (°C)</option> <option value="F" class="text-gray-900">Fahrenheit (°F)</option> <option value="K" class="text-gray-900">Kelvin (K)</option> </select>
       </div>
       <div><label for="to-unit" class="text-white/80 text-sm font-medium mb-1 block">To</label> <select id="to-unit" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-white/40 transition appearance-none"> <option value="F" class="text-gray-900">Fahrenheit (°F)</option> <option value="C" class="text-gray-900">Celsius (°C)</option> <option value="K" class="text-gray-900">Kelvin (K)</option> </select>
       </div>
      </div>
      <div class="flex gap-3"><button id="convert-btn" class="flex-1 bg-white/20 hover:bg-white/30 text-white font-semibold py-3 rounded-xl transition-all hover:scale-[1.02] active:scale-95">Convert</button> <button id="clear-btn" class="bg-white/10 hover:bg-white/20 text-white/70 font-medium py-3 px-5 rounded-xl transition-all hover:scale-[1.02] active:scale-95">Clear</button>
      </div>
     </div><!-- Result -->
     <div id="result" class="mt-5 hidden"></div>
    </div><!-- History -->
    <div id="history-section" class="glass rounded-2xl p-5 hidden">
     <div class="flex justify-between items-center mb-3">
      <h2 class="text-white font-semibold text-lg">History</h2><button id="clear-history" class="text-white/50 text-sm hover:text-white/80 transition">Clear</button>
     </div>
     <ul id="history-list" class="space-y-2"></ul>
    </div>
   </div>
  </div>
  <script>
    const defaultConfig = { page_title: 'Temperature Converter' };
    let config = { ...defaultConfig };

    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (c) => {
        config = c;
        document.getElementById('title').textContent = c.page_title || defaultConfig.page_title;
      },
      mapToCapabilities: (c) => ({ recolorables: [], borderables: [], fontEditable: undefined, fontSizeable: undefined }),
      mapToEditPanelValues: (c) => new Map([['page_title', c.page_title || defaultConfig.page_title]])
    });

    // Theme
    const theme = localStorage.getItem('tc-theme') || 'light';
    if (theme === 'dark') document.documentElement.classList.add('dark');
    document.getElementById('theme-toggle').onclick = () => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('tc-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      lucide.createIcons();
    };

    // DateTime
    function updateTime() {
      document.getElementById('datetime').textContent = new Date().toLocaleString();
    }
    updateTime(); setInterval(updateTime, 1000);

    // History
    let history = JSON.parse(localStorage.getItem('tc-history') || '[]');
    function renderHistory() {
      const section = document.getElementById('history-section');
      const list = document.getElementById('history-list');
      if (!history.length) { section.classList.add('hidden'); return; }
      section.classList.remove('hidden');
      list.innerHTML = history.map(h => `<li class="text-white/70 text-sm bg-white/5 rounded-lg px-3 py-2">${h}</li>`).join('');
    }
    renderHistory();
    document.getElementById('clear-history').onclick = () => { history = []; localStorage.setItem('tc-history', '[]'); renderHistory(); };

    // Toast
    function toast(msg, type) {
      const el = document.createElement('div');
      el.className = `toast px-4 py-2 rounded-xl text-sm font-medium text-white ${type === 'error' ? 'bg-red-500/90' : 'bg-green-500/90'}`;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // Conversion
    const units = { C: '°C', F: '°F', K: 'K' };
    function convert(val, from, to) {
      if (from === to) return val;
      let c;
      if (from === 'C') c = val;
      else if (from === 'F') c = (val - 32) * 5/9;
      else c = val - 273.15;
      if (to === 'C') return c;
      if (to === 'F') return c * 9/5 + 32;
      return c + 273.15;
    }

    function doConvert() {
      const input = document.getElementById('temp-input').value.trim();
      const from = document.getElementById('from-unit').value;
      const to = document.getElementById('to-unit').value;
      const resultDiv = document.getElementById('result');

      if (!input || isNaN(input)) { toast('Please enter a valid number', 'error'); return; }
      if (from === to) { toast('Please select different units', 'error'); return; }

      const val = parseFloat(input);
      const result = convert(val, from, to).toFixed(2);
      resultDiv.innerHTML = `<div class="result-card bg-white/10 rounded-xl p-4 text-center"><p class="text-white/60 text-sm">Result</p><p class="text-white text-2xl font-bold mt-1">${val} ${units[from]} = ${result} ${units[to]}</p></div>`;
      resultDiv.classList.remove('hidden');

      const entry = `${val} ${units[from]} → ${result} ${units[to]}`;
      history.unshift(entry);
      history = history.slice(0, 5);
      localStorage.setItem('tc-history', JSON.stringify(history));
      renderHistory();
      toast('Converted successfully!', 'success');
    }

    document.getElementById('convert-btn').onclick = doConvert;
    document.getElementById('temp-input').addEventListener('keydown', e => { if (e.key === 'Enter') doConvert(); });
    document.getElementById('clear-btn').onclick = () => {
      document.getElementById('temp-input').value = '';
      document.getElementById('result').classList.add('hidden');
    };

    lucide.createIcons();
  </script>

</html>
